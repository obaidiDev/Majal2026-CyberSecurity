<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Majal Store{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='store.css') }}">
</head>
<body>
<header class="bar">
  <div class="in">
    <img src="{{ url_for('static', filename='majal-logo.jpg') }}" alt="Majal">
    <a class="brand" href="{{ url_for('index') }}">Majal<span>Store</span></a>
    <div class="spacer"></div>
    <nav>
      <a href="{{ url_for('index') }}">Shop</a>
      {% if user %}
        {% if user['is_admin'] %}<a href="{{ url_for('admin') }}">Network Tools</a>{% endif %}
        <a href="{{ url_for('account') }}">My Account</a>
        <a href="{{ url_for('logout') }}">Log out</a>
        <span class="who">{{ user['fullname'] }}</span>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="wrap">
{% block body %}{% endblock %}
</main>

<footer class="footer">
  Majal Store — internal demo environment · © {{ year }} Majal ·
  <span class="muted">For authorised training use only.</span>
</footer>
</body>
</html>
