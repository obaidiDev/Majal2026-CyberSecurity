<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Majal SOC — Investigation Console</title>
<style>
  :root{
    --ink:#12333D; --petrol:#00567C; --teal:#1F8F89; --red:#D64545;
    --amber:#F2C14E; --muted:#5C7880; --faint:#8AA1A8;
    --line:#CDD8DA; --line2:#E0E7E8; --bg:#F6F8F8; --panel:#fff; --dark:#04303F;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       color:var(--ink);background:var(--bg)}
  button{font:inherit;cursor:pointer}

  /* ---------- shell ---------- */
  .top{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--dark);color:#BFE0E2}
  .top .brand{font-weight:800;letter-spacing:.02em;color:#fff;font-size:15px}
  .top .brand span{color:var(--teal)}
  .top .win{font-family:var(--mono);font-size:11.5px;color:#5f97a3}
  .top .spacer{flex:1}
  .top .stat{font-family:var(--mono);font-size:11.5px;color:#9fc9cf}
  .top .stat b{color:var(--amber)}

  .main{display:grid;grid-template-columns:224px 1fr 348px;gap:0;height:calc(100vh - 41px)}
  .rail,.case{overflow-y:auto;background:var(--panel)}
  .rail{border-right:1px solid var(--line2)}
  .case{border-left:1px solid var(--line2)}
  .work{display:flex;flex-direction:column;min-width:0;overflow:hidden}

  .secthd{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;
          color:var(--faint);padding:12px 13px 6px}

  /* ---------- alert queue ---------- */
  .tier{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 13px;
        border-left:3px solid transparent;border-bottom:1px solid var(--line2)}
  .tier:hover{background:#F1F6F6}
  .tier.on{background:#EAF3F2;border-left-color:var(--teal)}
  .tier .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
  .tier .dsc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
  .pill{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
        padding:2px 6px;border-radius:20px;color:#fff}
  .p0{background:#7FA6B0}.p1{background:var(--teal)}.p2{background:var(--petrol)}
  .p3{background:#C4772F}.p4{background:var(--red)}

  /* ---------- filter bar ---------- */
  .bar{padding:9px 13px;border-bottom:1px solid var(--line2);background:var(--panel)}
  .srch{display:flex;gap:7px;align-items:center}
  .srch input{flex:1;font-family:var(--mono);font-size:12.5px;padding:7px 9px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:6px;outline:none}
  .srch input:focus{border-color:var(--petrol);background:#fff}
  .srch button{font-size:11.5px;padding:7px 11px;border:1px solid var(--line);border-radius:6px;
    background:#fff;color:var(--muted)}
  .srch button:hover{border-color:var(--petrol);color:var(--petrol)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
    background:#EAF1F4;border:1px solid #C3D6DE;color:var(--petrol);border-radius:20px;padding:3px 5px 3px 9px}
  .chip b{font-weight:700}
  .chip .x{border:0;background:none;color:var(--petrol);opacity:.6;padding:0 3px;line-height:1;font-size:14px}
  .chip .x:hover{opacity:1;color:var(--red)}
  .chip.neg{background:#FBECEC;border-color:#EBC3C3;color:var(--red)}
  .chip.neg .x{color:var(--red)}

  /* ---------- histogram ---------- */
  .histwrap{padding:8px 13px 4px;border-bottom:1px solid var(--line2);background:var(--panel)}
  .histhd{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .histhd .t{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--faint)}
  .histhd .hint{font-size:10.5px;color:var(--faint)}
  .histhd .modes{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .histhd .modes button{border:0;background:#fff;color:var(--muted);font-size:10.5px;padding:3px 9px}
  .histhd .modes button.on{background:var(--petrol);color:#fff}
  canvas{display:block;width:100%;height:104px;cursor:crosshair}

  /* ---------- table ---------- */
  .tblwrap{flex:1;overflow:auto;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
  thead th{position:sticky;top:0;background:#EEF3F3;text-align:left;font-weight:700;color:var(--muted);
    padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.05em;z-index:2}
  tbody td{padding:4px 8px;border-bottom:1px solid #F0F4F4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:#F5FAFA}
  tbody tr.auth{background:#FFFDF4}
  tbody tr.auth:hover{background:#FDF7E4}
  .v{cursor:pointer;border-bottom:1px dotted transparent}
  .v:hover{color:var(--petrol);border-bottom-color:var(--petrol)}
  .st2{color:var(--teal)}.st3{color:var(--faint)}.st4{color:#C4772F}.st5{color:var(--red);font-weight:700}
  td.path{max-width:0;width:44%}
  .evt{font-weight:700;font-size:10.5px}
  .evt.f{color:var(--red)}.evt.s{color:var(--teal)}.evt.a{color:var(--petrol)}
  .add{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:4px;
       font-size:10px;padding:1px 6px;line-height:1.5}
  .add:hover{border-color:var(--teal);color:var(--teal)}
  .add.in{background:var(--teal);border-color:var(--teal);color:#fff}
  .foot{padding:7px 13px;font-size:11px;color:var(--faint);border-top:1px solid var(--line2);background:var(--panel)}
  .foot b{color:var(--ink)}

  /* ---------- detail ---------- */
  tr.det td{background:#FAFCFC;white-space:normal;padding:9px 12px}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:3px 10px;font-size:11.5px}
  .kv .k{color:var(--faint);text-transform:uppercase;font-size:9.5px;letter-spacing:.05em;padding-top:2px}
  .kv .val{word-break:break-all;color:var(--ink)}

  /* ---------- case notebook ---------- */
  .case .ent{padding:8px 12px;border-bottom:1px solid var(--line2);font-size:11.5px}
  .case .ent .ts{font-family:var(--mono);font-size:10.5px;color:var(--petrol);font-weight:700}
  .case .ent .bd{font-family:var(--mono);font-size:10.5px;color:var(--muted);
    word-break:break-all;margin-top:2px;line-height:1.4}
  .case .ent .cite{font-size:9.5px;color:var(--faint);margin-top:3px}
  .case .ent .rm{float:right;border:0;background:none;color:var(--faint);font-size:13px;line-height:1;padding:0 2px}
  .case .ent .rm:hover{color:var(--red)}
  .case .empty{padding:14px 13px;font-size:11.5px;color:var(--faint);line-height:1.5}
  .caseacts{padding:9px 12px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--panel)}
  .caseacts button{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;
    background:#fff;color:var(--petrol);font-size:11.5px;font-weight:700}
  .caseacts button:hover{border-color:var(--petrol)}
  .load{padding:40px;text-align:center;color:var(--muted);font-size:13px}

  /* ---------- report panel ---------- */
  .tabs{display:flex;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel);z-index:3}
  .tabs button{flex:1;border:0;background:none;padding:9px 6px;font-size:11.5px;font-weight:700;
    color:var(--faint);border-bottom:2px solid transparent}
  .tabs button.on{color:var(--petrol);border-bottom-color:var(--petrol)}
  .team{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2)}
  .team label{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:800}
  .team input{flex:1;min-width:0;font-size:12px;padding:5px 7px;border:1px solid var(--line);
    border-radius:5px;background:var(--bg);outline:none;color:var(--ink)}
  .team input:focus{border-color:var(--petrol);background:#fff}
  .team .score{font-family:var(--mono);font-size:19px;font-weight:800;color:var(--teal);min-width:34px;text-align:right}
  .team .score.neg{color:var(--red)}

  .scn{border-bottom:1px solid var(--line2)}
  .scnhd{display:flex;align-items:center;gap:7px;padding:8px 12px;cursor:pointer;background:#FAFCFC}
  .scnhd:hover{background:#F1F6F6}
  .scnhd .nm{font-weight:700;font-size:12px;flex:1}
  .scnhd .prog{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .scnbody{padding:2px 12px 10px;display:none}
  .scn.open .scnbody{display:block}
  .brief{font-size:11px;color:var(--muted);line-height:1.45;margin:4px 0 9px;
    border-left:2px solid var(--line);padding-left:8px}

  .fld{margin-bottom:9px}
  .fk{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:3px;line-height:1.3}
  .fk .hint{font-weight:400;color:var(--faint);font-size:10px}
  .fin{display:flex;gap:4px}
  .fin input{flex:1;min-width:0;font-family:var(--mono);font-size:11px;padding:4px 6px;
    border:1px solid var(--line);border-radius:4px;background:#fff;outline:none;color:var(--ink)}
  .fin input:focus{border-color:var(--petrol)}
  .fin select{font-size:10px;border:1px solid var(--line);border-radius:4px;background:#fff;
    color:var(--muted);padding:4px 2px;max-width:74px}
  .fin button{border:1px solid var(--line);background:#fff;color:var(--petrol);border-radius:4px;
    font-size:10px;font-weight:700;padding:4px 7px}
  .fin button:hover{border-color:var(--petrol)}
  .cbd{display:block;margin-top:3px;border:0;background:none;color:var(--faint);
    font-size:9.5px;text-decoration:underline;padding:0}
  .cbd:hover{color:var(--petrol)}
  .cbd.on{color:var(--petrol);font-weight:700}
  .fmsg{font-size:10px;margin-top:3px;line-height:1.35}
  .fld.ok .fin input{background:#EDF7F5;border-color:var(--teal);color:var(--teal);font-weight:700}
  .fld.ok .fmsg{color:var(--teal)}
  .fld.bad .fin input{background:#FDF0F0;border-color:var(--red)}
  .fld.bad .fmsg{color:var(--red)}
  .fld.locked .fin input,.fld.locked .fin select,.fld.locked .fin button{pointer-events:none;opacity:.85}
</style>
</head><body>

<div class="top">
  <div class="brand">MAJAL <span>SOC</span></div>
  <div class="win" id="win">loading…</div>
  <div class="spacer"></div>
  <div class="stat" id="stat"></div>
</div>

<div class="main">
  <div class="rail">
    <div class="secthd">Alert queue</div>
    <div id="tiers"></div>
    <div class="secthd">Sources</div>
    <div id="sources"></div>
  </div>

  <div class="work">
    <div class="bar">
      <div class="srch">
        <input id="q" placeholder="search any field — an address, a path, a username…" spellcheck="false">
        <button id="clear">clear all</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="histwrap">
      <div class="histhd">
        <span class="t">Timeline</span>
        <span class="hint" id="hhint">drag to zoom a range · double-click to reset</span>
        <span class="modes">
          <button data-m="time" class="on">over time</button>
          <button data-m="hour">by hour of day</button>
        </span>
        <span class="modes" style="margin-left:6px">
          <button data-s="log" class="on">log</button>
          <button data-s="lin">linear</button>
        </span>
      </div>
      <canvas id="hist"></canvas>
    </div>
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th style="width:132px"><span class="v" id="sortT">Time (UTC) ↓</span></th><th style="width:118px">Source IP</th>
          <th style="width:52px">Verb</th><th class="path">Path / Event</th>
          <th style="width:44px">Code</th><th style="width:62px">Bytes</th>
          <th style="width:56px"></th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="foot" id="foot"></div>
  </div>

  <div class="case">
    <div class="tabs">
      <button data-tab="report" class="on">Report</button>
      <button data-tab="case">Case <span id="caseN"></span></button>
    </div>

    <div id="tabReport">
      <div class="team">
        <label>Team</label>
        <input id="team" placeholder="team name" spellcheck="false">
        <div class="score" id="scoreBig">0</div>
      </div>
      <div id="report"></div>
      <div class="caseacts">
        <button id="submitAll">Export score for the board</button>
      </div>
    </div>

    <div id="tabCase" hidden>
      <div id="caseList"><div class="empty">Empty. Use <b>+case</b> on any row to pin it here — the citation is attached automatically.</div></div>
      <div class="caseacts"><button id="export">Export case timeline</button></div>
    </div>
  </div>
</div>

<script>
(async function(){
const $ = s => document.querySelector(s);

// ---------- load & inflate ----------
const b64 = $('#payload').textContent.trim();
const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
let json;
try {
  const ds = new DecompressionStream('gzip');
  const buf = await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
  json = JSON.parse(new TextDecoder().decode(buf));
} catch (e) {
  document.body.innerHTML = '<div class="load">This browser cannot inflate the dataset '
    + '(needs DecompressionStream). Use a current Chrome, Edge or Firefox.</div>';
  return;
}
const D = json.dict, EP = json.epoch, ROWS = json.rows;
const IP=D.ip, PATH=D.path, UA=D.ua, USER=D.user, EVT=D.evt, METH=D.meth;

// column indices
const T=0, KIND=1, IPI=2, MI=3, PI=4, ST=5, BY=6, UAI=7, USI=8, EVI=9;

const pad = n => String(n).padStart(2,'0');
function fmt(t){
  const d = new Date((EP+t)*1000);
  return d.getUTCDate()+' Jul '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());
}
const hourOf = t => new Date((EP+t)*1000).getUTCHours();

// ---------- filter state ----------
// desc by default: newest first, the way every SIEM opens. Otherwise the
// table's first screen is 400 rows of the monitoring probe.
let F = { text:'', chips:[], t0:null, t1:null, desc:true };
const chipKey = c => c.field+'|'+c.value+'|'+(c.neg?'!':'');

function addChip(field, value, neg){
  const c = {field, value, neg:!!neg};
  if (!F.chips.some(x => chipKey(x)===chipKey(c))) F.chips.push(c);
  render();
}

function rowMatches(r){
  if (F.t0!==null && (r[T]<F.t0 || r[T]>F.t1)) return false;
  for (const c of F.chips){
    let hit;
    switch(c.field){
      case 'ip':     hit = IP[r[IPI]]===c.value; break;
      case 'status': hit = String(r[ST])===c.value; break;
      case 'verb':   hit = r[MI]>=0 && METH[r[MI]]===c.value; break;
      case 'source': hit = (r[KIND]===0?'web':'auth')===c.value; break;
      case 'user':   hit = r[USI]>=0 && USER[r[USI]]===c.value; break;
      case 'event':  hit = r[EVI]>=0 && EVT[r[EVI]]===c.value; break;
      case 'ua':     hit = r[UAI]>=0 && UA[r[UAI]]===c.value; break;
      case 'path':   hit = PATH[r[PI]].includes(c.value); break;
      default: hit = true;
    }
    if (c.neg ? hit : !hit) return false;
  }
  if (F.text){
    const q = F.text.toLowerCase();
    const hay = (IP[r[IPI]]||'') + ' ' + (PATH[r[PI]]||'') + ' ' + (r[UAI]>=0?UA[r[UAI]]:'')
              + ' ' + (r[USI]>=0?USER[r[USI]]:'') + ' ' + r[ST];
    if (!hay.toLowerCase().includes(q)) return false;
  }
  return true;
}

// ---------- histogram ----------
let histMode = 'time', histScale = 'log';
const cv = $('#hist'), cx = cv.getContext('2d');
let bins=[], binT0=0, binW=0, drag=null;
let viewOrg=0, viewSpan=84*3600;

function drawHist(){
  const W = cv.clientWidth, H = 104;
  cv.width = W*devicePixelRatio; cv.height = H*devicePixelRatio;
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,W,H);

  // Re-bin to whatever range is in view. Without this the resolution is stuck
  // at one hour and short outages — like the seven-minute logging gap — are
  // invisible no matter how far you zoom.
  const zoomed = histMode==='time' && F.t0!==null;
  const N = histMode==='hour' ? 24 : 84;
  const org  = zoomed ? F.t0 : 0;
  const span = zoomed ? Math.max(60, F.t1-F.t0) : 84*3600;
  bins = new Array(N).fill(0);
  for (const gi of view){
    const t = ROWS[gi][T];
    const i = histMode==='hour' ? hourOf(t)
            : Math.max(0, Math.min(N-1, Math.floor((t-org)/(span/N))));
    bins[i]++;
  }
  binT0 = org; binW = span/N; viewOrg = org; viewSpan = span;
  const max = Math.max(1, ...bins);
  const bw = W/N;
  // The assessment burst is ~3 orders of magnitude above the quiet days. On a
  // linear axis the baseline is invisible, and the baseline is where the slow
  // exfiltration lives — so scale defaults to log.
  const scaleY = v => histScale==='log'
    ? Math.log1p(v)/Math.log1p(max)
    : v/max;
  for (let i=0;i<N;i++){
    const h = Math.round(scaleY(bins[i])*(H-22));
    cx.fillStyle = bins[i] ? '#1F8F89' : '#E6EDED';
    cx.fillRect(i*bw+0.5, H-18-h, Math.max(1,bw-1), Math.max(bins[i]?1:1,h));
  }
  // day / hour ticks
  cx.fillStyle = '#8AA1A8'; cx.font = '9px ui-monospace,monospace';
  if (histMode==='time' && zoomed){
    for (let k=0; k<=4; k++){
      const x = (k/4)*W;
      cx.fillStyle='#CDD8DA'; cx.fillRect(x,0,1,H-18);
      cx.fillStyle='#8AA1A8';
      cx.fillText(fmt(org + (span*k/4)).slice(-8), Math.min(x+4, W-52), H-6);
    }
    const empty = bins.filter(b=>b===0).length;
    if (empty){
      cx.fillStyle='#D64545';
      cx.fillText(empty+'/'+N+' buckets empty', W-118, 12);
    }
  } else if (histMode==='time'){
    for (let d=0; d<4; d++){
      const x = (d*24/N)*W;
      cx.fillStyle='#CDD8DA'; cx.fillRect(x,0,1,H-18);
      cx.fillStyle='#8AA1A8'; cx.fillText((26+d)+' Jul', x+4, H-6);
    }
  } else {
    for (let h=0; h<24; h+=3){
      cx.fillText(pad(h)+':00', (h/24)*W+2, H-6);
    }
    cx.fillStyle='#8AA1A8';
    cx.fillText('← humans sleep here', W*0.09, 12);
  }
  if (drag){
    cx.fillStyle='rgba(31,143,137,.16)';
    cx.fillRect(Math.min(drag.a,drag.b),0,Math.abs(drag.b-drag.a),H-18);
  }
}
function xToT(x){
  const t = viewOrg + (x/cv.clientWidth)*viewSpan;
  return Math.max(0, Math.min(84*3600, t));
}
cv.addEventListener('mousedown', e=>{
  if (histMode!=='time') return;
  const x = e.offsetX; drag={a:x,b:x}; drawHist();
});
cv.addEventListener('mousemove', e=>{ if(drag){ drag.b=e.offsetX; drawHist(); } });
window.addEventListener('mouseup', ()=>{
  if (!drag) return;
  if (Math.abs(drag.b-drag.a) > 4){
    F.t0 = xToT(Math.min(drag.a,drag.b)); F.t1 = xToT(Math.max(drag.a,drag.b));
  }
  drag=null; render();
});

const SALT = 'majal-day5-2026';
const CBD = '__cannot_be_determined__';

// Must match make_fields.py norm() exactly.
const norm = s => String(s).trim().toLowerCase()
  .replace(/\s+/g,' ').replace(/\s*utc$/,'').replace(/,/g,'');

async function digest(v){
  const b = new TextEncoder().encode(SALT + norm(v));
  const d = await crypto.subtle.digest('SHA-256', b);
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16);
}

  const el = btn.closest('.fld');
  if (el.classList.contains('locked')) return;
  const si=+el.dataset.si, fi=+el.dataset.fi;
  const st = RS[si][fi], f = SCN[si].fields[fi];
  if (st.tries>=3 && !st.correct) return;

  const isCbd = el.querySelector('.cbd').classList.contains('on');
  const raw = isCbd ? CBD : el.querySelector('input').value;
  if (!isCbd && !raw.trim()) return;
  const conf = el.querySelector('select').value;
  st.val = isCbd ? 'cannot be determined' : raw;
  st.conf = conf; st.tries++;

  const hv = await digest(raw);
  const hit = f.a.includes(hv);

  let d = 0;
  if (hit){
    d = f.cbd ? 3 : (conf==='high' ? 2 : 1);
  } else {
    // The rule: a confidently wrong answer scores below "I don't know."
    d = f.cbd ? -1 : (conf==='high' ? -3 : -1);
  }
  st.pts += d; st.correct = hit; st.done = true;
  saveRS(); paint(el, st); paintScores();
});

$('#team').value = TEAM;
$('#team').addEventListener('input', e=>{ TEAM = e.target.value.trim(); saveRS(); });

$('#submitAll').addEventListener('click', ()=>{
  if (!TEAM){ alert('Enter a team name first.'); return; }
  const payload = {
    t: TEAM, s: total(), p: CASE.length,
    d: SCN.map((s,si)=>[scnDone(si), scnScore(si)]),
    ts: Date.now()
  };
  const token = btoa(JSON.stringify(payload)).replace(/=+$/,'');
  navigator.clipboard?.writeText(token).catch(()=>{});
  prompt('Score token — copied to your clipboard. Hand it to the instructor:', token);
});

document.querySelector('.tabs').addEventListener('click', e=>{
  const b=e.target.closest('[data-tab]'); if(!b) return;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  $('#tabReport').hidden = b.dataset.tab!=='report';
  $('#tabCase').hidden   = b.dataset.tab!=='case';
});

buildReport();
$('#win').textContent = '26–29 Jul 2026 · all times UTC';
render();
})();
</script>
