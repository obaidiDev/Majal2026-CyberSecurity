{% extends "base.html" %}
{% block title %}Log in — Majal Store{% endblock %}
{% block body %}

<div class="panel narrow">
  <h2>Log in</h2>
  <p class="sub">Access your orders and account.</p>

  {% if error %}<div class="err"><code>{{ error }}</code></div>{% endif %}

  <form method="post" action="{{ url_for('login') }}">
    <label>Username</label>
    <input type="text" name="username" autocomplete="off" autofocus>
    <label>Password</label>
    <input type="password" name="password">
    <div style="margin-top:18px"><button class="btn" type="submit">Log in</button></div>
  </form>
</div>
{% endblock %}
