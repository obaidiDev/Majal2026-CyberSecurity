<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 6px 8px; }
  .w { padding: 12px 14px; }
  .dump { border: 1px solid #E0E7E8; border-radius: 9px; overflow: hidden; background: #fff; }
  table.cr { width: 100%; border-collapse: collapse; font-family: var(--mono,monospace); font-size: 12px; }
  table.cr th { background: #eef2f3; color: #5c7880; text-align: left; padding: 6px 10px; font-size: 10px;
    text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #C9D3D5; }
  table.cr td { padding: 7px 10px; border-bottom: 1px solid #eef2f2; }
  table.cr td.user { color: #00567C; font-weight: 700; }
  table.cr td.hash { color: #93a4aa; font-size: 11px; }
  .res .q { color: #a8b6bb; } .res .try { color: #a06a2a; }
  .res .crk { color: #b3261e; font-weight: 700; } .res .crk .pw { background:#ffe3e3; padding:0 4px; border-radius:3px; }
  .res .safe { color: #2b7a4b; font-weight: 700; }
  .res .pth { color: #7a2fb0; font-weight: 800; }
  .stt { font-size: .6em; color: #93a4aa; }
  .status { display: flex; align-items: center; gap: 14px; margin: 9px 0; padding: 8px 11px; border-radius: 8px;
    background: #04121a; color: #9fb3b8; font-family: var(--mono,monospace); font-size: 11.5px; min-height: 20px; }
  .status .k { color: #5c7d86; } .status b { color: #33D3CB; } .status .word { color: #ffd23f; }
  .status.idle { color:#5c7d86; }
  .cap { min-height: 42px; margin-top: 4px; }
</style>
</head><body>
<div class="w">
  <div class="dump">
    <table class="cr">
      <thead><tr><th style="width:130px">User</th><th style="width:230px">NT hash — <span style="text-transform:none;letter-spacing:0">web01's Samba DB, dumped as root</span></th><th>Result</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="status idle" id="status">idle — passwords are stored as one-way <b style="color:#5c7d86">hashes</b>, not plain text. Crack them offline, or reuse them directly.</div>
  <div class="ctl">
    <button class="primary" id="crack">▶ Run dictionary attack</button>
    <button id="pth" disabled>🔑 Pass-the-hash (administrator)</button>
    <button id="reset">↺ Reset</button>
  </div>
  <div class="cap" id="cap"></div>
</div>
<script>
/* ---------------------------------------------------------------------------
   Real NTLM, computed in the browser: NT hash = MD4(password as UTF-16LE).
   The hashes in the table below are NOT typed in — they are derived from the
   passwords at load, and the dictionary attack really hashes every candidate
   and compares. Toy scale (16 words); real scale stated in the closing caption.
   --------------------------------------------------------------------------- */
function md4(bytes) {
  function rol(x, n) { return ((x << n) | (x >>> (32 - n))) >>> 0; }
  var msg = bytes.slice(), bitLen = bytes.length * 8;
  msg.push(0x80);
  while (msg.length % 64 !== 56) msg.push(0);
  var lo = bitLen >>> 0, hi = Math.floor(bitLen / 4294967296);
  msg.push(lo & 255, (lo >>> 8) & 255, (lo >>> 16) & 255, (lo >>> 24) & 255,
           hi & 255, (hi >>> 8) & 255, (hi >>> 16) & 255, (hi >>> 24) & 255);

  var A = 0x67452301, B = 0xefcdab89, C = 0x98badcfe, D = 0x10325476;
  var F = function (x, y, z) { return (x & y) | (~x & z); };
  var G = function (x, y, z) { return (x & y) | (x & z) | (y & z); };
  var H = function (x, y, z) { return x ^ y ^ z; };
  var S1 = [3, 7, 11, 19], S2 = [3, 5, 9, 13], S3 = [3, 9, 11, 15];
  var O2 = [0, 4, 8, 12, 1, 5, 9, 13, 2, 6, 10, 14, 3, 7, 11, 15];
  var O3 = [0, 8, 4, 12, 2, 10, 6, 14, 1, 9, 5, 13, 3, 11, 7, 15];

  for (var off = 0; off < msg.length; off += 64) {
    var X = [], i;
    for (i = 0; i < 16; i++) {
      X[i] = (msg[off + i * 4] | (msg[off + i * 4 + 1] << 8) |
              (msg[off + i * 4 + 2] << 16) | (msg[off + i * 4 + 3] << 24)) >>> 0;
    }
    var a = A, b = B, c = C, d = D, s;
    for (i = 0; i < 16; i++) {                      // round 1
      s = S1[i % 4];
      if (i % 4 === 0)      a = rol((a + F(b, c, d) + X[i]) >>> 0, s);
      else if (i % 4 === 1) d = rol((d + F(a, b, c) + X[i]) >>> 0, s);
      else if (i % 4 === 2) c = rol((c + F(d, a, b) + X[i]) >>> 0, s);
      else                  b = rol((b + F(c, d, a) + X[i]) >>> 0, s);
    }
    for (i = 0; i < 16; i++) {                      // round 2
      s = S2[i % 4];
      if (i % 4 === 0)      a = rol((a + G(b, c, d) + X[O2[i]] + 0x5a827999) >>> 0, s);
      else if (i % 4 === 1) d = rol((d + G(a, b, c) + X[O2[i]] + 0x5a827999) >>> 0, s);
      else if (i % 4 === 2) c = rol((c + G(d, a, b) + X[O2[i]] + 0x5a827999) >>> 0, s);
      else                  b = rol((b + G(c, d, a) + X[O2[i]] + 0x5a827999) >>> 0, s);
    }
    for (i = 0; i < 16; i++) {                      // round 3
      s = S3[i % 4];
      if (i % 4 === 0)      a = rol((a + H(b, c, d) + X[O3[i]] + 0x6ed9eba1) >>> 0, s);
      else if (i % 4 === 1) d = rol((d + H(a, b, c) + X[O3[i]] + 0x6ed9eba1) >>> 0, s);
      else if (i % 4 === 2) c = rol((c + H(d, a, b) + X[O3[i]] + 0x6ed9eba1) >>> 0, s);
      else                  b = rol((b + H(c, d, a) + X[O3[i]] + 0x6ed9eba1) >>> 0, s);
    }
    A = (A + a) >>> 0; B = (B + b) >>> 0; C = (C + c) >>> 0; D = (D + d) >>> 0;
  }
  return [A, B, C, D].map(function (v) {
    var out = "";
    for (var j = 0; j < 4; j++) out += ("0" + ((v >>> (j * 8)) & 255).toString(16)).slice(-2);
    return out;
  }).join("");
}
function ntlm(pw) {                                  // password → UTF-16LE bytes → MD4
  var b = [];
  for (var i = 0; i < pw.length; i++) { var c = pw.charCodeAt(i); b.push(c & 0xff, (c >> 8) & 0xff); }
  return md4(b);
}

var ACCTS = [
  {user:"bob",           pw:"sunshine",         tc:"instant · top-100 list"},
  {user:"alice",         pw:"Summer2026!",      tc:"~seconds · word + rules"},
  {user:"svc_backup",    pw:"P@ssw0rd!",        tc:"~seconds · very common"},
  {user:"administrator", pw:"7Kq!vB2mZr9#Xw4T", tc:"~centuries · 16 random chars", strong:1}
];
ACCTS.forEach(function (a) { a.hash = ntlm(a.pw); });   // the table shows REAL hashes

// The wordlist the attack actually walks. Three of the four passwords are in it.
var WORDS = ["123456","password","qwerty","letmein","dragon","sunshine","monkey","football",
  "iloveyou","Summer2025","P@ssw0rd","hunter2","Summer2026!","admin123","trustno1","P@ssw0rd!"];

var rowsEl=document.getElementById("rows"), statusEl=document.getElementById("status");
var cracking=false, raf=null, t0=0, done=false, pthDone=false;
var found = {};                     // user → the word that actually matched the hash

function rowHTML(a, state){
  var res;
  if(state==="idle") res='<span class="q">— not attempted —</span>';
  else if(state==="trying") res='<span class="try">cracking…</span>';
  else if(state==="cracked") res='<span class="crk">cracked → <span class="pw">'+(found[a.user]||a.pw)+'</span></span> <span class="stt">'+a.tc+'</span>';
  else if(state==="safe") res='<span class="safe">not in wordlist</span> <span class="stt">'+a.tc+'</span>';
  else if(state==="pth") res='<span class="pth">✓ OWNED via pass-the-hash</span> <span class="stt">(password never learned)</span>';
  return '<tr><td class="user">'+a.user+'</td><td class="hash">'+a.hash+'</td><td class="res">'+res+'</td></tr>';
}
function render(states){ rowsEl.innerHTML = ACCTS.map(function(a,i){ return rowHTML(a, states[i]); }).join(""); }
var STATES = ["idle","idle","idle","idle"];
render(STATES);

function setStatus(html, idle){ statusEl.className = "status"+(idle?" idle":""); statusEl.innerHTML = html; }

var STEP_MS = 265;   // one candidate per tick, so the room can read the wordlist
function runCrack(){
  if(cracking||done) return; cracking=true; document.getElementById("crack").disabled=true;
  STATES = ["trying","trying","trying","trying"]; render(STATES);
  t0=0; var idx=-1;
  function frame(ts){
    if(!t0) t0=ts;
    var want = Math.min(WORDS.length, Math.floor((ts-t0)/STEP_MS));
    while(idx < want-1){
      idx++;
      var word = WORDS[idx], h = ntlm(word);          // hash the candidate for real…
      ACCTS.forEach(function(a,i){                    // …and compare to every row at once
        if(STATES[i]==="trying" && a.hash===h){ STATES[i]="cracked"; found[a.user]=word; }
      });
      var got = ACCTS.filter(function(a){ return found[a.user]; }).length;
      setStatus('<span class="k">hashcat</span> · candidate <b>'+(idx+1)+'/'+WORDS.length+
        '</b> · hashing <span class="word">'+word+'</span> → <b>'+h.slice(0,12)+'…</b> · '+
        '<b style="color:#7fd18b">'+got+'</b> of 4 recovered');
      render(STATES);
    }
    if(idx < WORDS.length-1){ raf=requestAnimationFrame(frame); }
    else {
      ACCTS.forEach(function(a,i){ if(STATES[i]==="trying"){ STATES[i]="safe"; } });
      render(STATES); cracking=false; done=true;
      document.getElementById("pth").disabled=false;
      var n=ACCTS.filter(function(a){ return found[a.user]; }).length;
      setStatus('wordlist exhausted — <b style="color:#7fd18b">'+n+' of 4 recovered</b>. Every hash here is the real NTLM of its password, and every candidate above was really hashed and compared.', true);
      document.getElementById("cap").innerHTML='Offline cracking speed is set entirely by <b>password strength</b>. bob, alice and svc_backup chose words a list already contains — gone. <b>administrator</b> used 16 random characters: not in any list, so not cracked. Note one candidate was hashed <em>once</em> and tested against <b>all four</b> accounts — NTLM has <b>no salt</b>. <span class="stt">Real scale: a GPU does tens of billions of NTLM guesses/sec against 14-million-word lists — these three fall in well under a second.</span> So don\'t crack administrator — <span class="pth" style="color:#7a2fb0">pass the hash</span>.';
    }
  }
  raf=requestAnimationFrame(frame);
}
function pthCmd(){
  return '<span class="k">$</span> impacket-psexec -hashes :'+ACCTS[3].hash+
    ' <span style="color:#33D3CB">administrator</span>@192.168.1.5 → <b style="color:#7fd18b">authenticated</b>';
}
function runPth(){
  if(!done||pthDone) return; pthDone=true;
  STATES[3]="pth"; render(STATES);
  setStatus(pthCmd());
  document.getElementById("pth").disabled=true;
  document.getElementById("cap").innerHTML='<span class="dngr">You logged in as administrator without ever knowing the password.</span> For NTLM/SMB, the <b>hash itself is the key</b> — a strong password can\'t save an account once its hash leaks. That same local admin account is reused on the file server (192.168.1.5, SMB open — you saw it in the port scan). This is the engine of <b>lateral movement</b> — next.';
}
document.getElementById("crack").onclick=runCrack;
document.getElementById("pth").onclick=runPth;
var CAP0 = 'web01 is a <b>Linux</b> box — but it also serves the department\'s file shares over <b>Samba</b> (port 445, from the port scan), and Samba keeps its own password database. As root: <span class="stt">pdbedit -L -w</span> hands you every account\'s <b>NT hash</b> — the same format Windows uses. You can\'t reverse a hash. Two ways forward: <b>crack</b> it offline, or <b>reuse</b> it as-is.';
document.getElementById("reset").onclick=function(){ if(raf)cancelAnimationFrame(raf); cracking=false; done=false; pthDone=false; found={};
  STATES=["idle","idle","idle","idle"]; render(STATES); document.getElementById("crack").disabled=false; document.getElementById("pth").disabled=true;
  setStatus('idle — passwords are stored as one-way <b style="color:#5c7d86">hashes</b>, not plain text. Crack them offline, or reuse them directly.', true);
  document.getElementById("cap").innerHTML=CAP0; };

document.getElementById("cap").innerHTML=CAP0;

// hooks: ?state=cracked|pth
var st=(location.search.match(/state=(\w+)/)||[])[1];
if(st==="cracked"||st==="pth"){
  STATES=["cracked","cracked","cracked","safe"];
  ACCTS.forEach(function(a){ if(!a.strong) found[a.user]=a.pw; });
  if(st==="pth"){ STATES[3]="pth"; }
  render(STATES); done=true; document.getElementById("crack").disabled=true;
  document.getElementById("pth").disabled = (st==="pth");
  if(st==="pth"){ pthDone=true;
    setStatus(pthCmd());
    document.getElementById("cap").innerHTML='<span class="dngr">You logged in as administrator without ever knowing the password.</span> For NTLM/SMB, the <b>hash itself is the key</b>. This is the engine of <b>lateral movement</b> — next.';
  } else {
    setStatus('wordlist exhausted — <b style="color:#7fd18b">3 of 4 recovered</b>. Weak &amp; seasonal passwords fell; the 16-char random one never appeared in the list.', true);
    document.getElementById("cap").innerHTML='Offline cracking speed is set entirely by <b>password strength</b>. The 16-char random administrator password is uncrackable this way — so <span class="pth" style="color:#7a2fb0">pass the hash</span> instead.';
  }
}
</script>
</body></html>
